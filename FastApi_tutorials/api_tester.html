<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dealership API Tester</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { font-family: system-ui, sans-serif; padding: 2rem; background: #f5f5f5; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { margin-bottom: 1.5rem; }
        .card { background: #fff; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .card h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }
        button { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; }
        button.get { background: #2563eb; color: #fff; }
        button.post { background: #16a34a; color: #fff; }
        pre { background: #1e1e2e; color: #cdd6f4; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; margin-top: 0.75rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; color: #374151; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 0.75rem; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Car Dealership API</h1>

        <div class="card">
            <h2>GET / — Welcome</h2>
            <button class="get" onclick="testWelcome()">Send Request</button>
            <pre id="output-welcome">Response will appear here...</pre>
        </div>

        <div class="card">
            <h2>GET /view — View All Cars</h2>
            <button class="get" onclick="testView()">Send Request</button>
            <pre id="output-view">Response will appear here...</pre>
        </div>

        <div class="card">
            <h2>POST /add — Add a Car</h2>
            <form onsubmit="testAdd(event)">
                <label>Car ID</label>
                <input id="car-id" value="1" />
                <div class="row">
                    <div>
                        <label>Name</label>
                        <input id="car-name" value="Toyota" />
                    </div>
                    <div>
                        <label>Model</label>
                        <input id="car-model" value="Camry" />
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Price</label>
                        <input id="car-price" value="25000" />
                    </div>
                    <div>
                        <label>Year</label>
                        <input id="car-year" value="2023" />
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Condition (bad/good/excellent)</label>
                        <input id="car-condition" value="good" />
                    </div>
                    <div>
                        <label>Rarity (common/rare/Antique)</label>
                        <input id="car-rarity" value="common" />
                    </div>
                </div>
                <button class="post" type="submit">Send Request</button>
            </form>
            <pre id="output-add">Response will appear here...</pre>
        </div>
    </div>

    <script>
        const BASE = "http://127.0.0.1:8000";

        async function testWelcome() {
            const el = document.getElementById("output-welcome");
            el.textContent = "Loading...";
            try {
                const res = await fetch(BASE + "/");
                el.textContent = JSON.stringify(await res.json(), null, 2);
            } catch (e) {
                el.textContent = "Error: " + e.message;
            }
        }

        async function testView() {
            const el = document.getElementById("output-view");
            el.textContent = "Loading...";
            try {
                const res = await fetch(BASE + "/view");
                el.textContent = JSON.stringify(await res.json(), null, 2);
            } catch (e) {
                el.textContent = "Error: " + e.message;
            }
        }

        async function testAdd(e) {
            e.preventDefault();
            const el = document.getElementById("output-add");
            el.textContent = "Loading...";
            const body = {
                [document.getElementById("car-id").value]: {
                    name: document.getElementById("car-name").value,
                    model: document.getElementById("car-model").value,
                    showroom_price: parseFloat(document.getElementById("car-price").value),
                    manufacture_year: parseInt(document.getElementById("car-year").value),
                    condition: document.getElementById("car-condition").value,
                    rarity: document.getElementById("car-rarity").value,
                }
            };
            try {
                const res = await fetch(BASE + "/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
});
                el.textContent = JSON.stringify(await res.json(), null, 2);
            } catch (e) {
                el.textContent = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
